<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — Aerospace Engineer &amp; AI Specialist{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | strip_html | truncate: 160 }}{% else %}{{ site.description | strip_html }}{% endif %}">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d12">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fb">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description | strip_html | truncate: 160 }}{% else %}{{ site.description | strip_html }}{% endif %}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{% if page.og_image %}{{ page.og_image | absolute_url }}{% else %}{{ '/assets/og-image.png' | absolute_url }}{% endif %}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ site.data.site.hero.name }} — {{ site.data.site.hero.title }}">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% if page.person_schema %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": {{ site.data.site.hero.name | jsonify }},
    "jobTitle": {{ site.data.site.hero.title | jsonify }},
    "url": {{ page.url | absolute_url | jsonify }},
    "email": {{ 'mailto:' | append: site.data.site.socials.email | jsonify }},
    "sameAs": [
      {{ site.data.site.socials.linkedin | jsonify }},
      {{ site.data.site.socials.github | jsonify }},
      {{ site.data.site.socials.medium | jsonify }}
    ]
  }
  </script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="wrap nav" aria-label="Main">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <a href="{{ '/#experience' | relative_url }}">Experience</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a class="nav-cta" href="{{ site.data.site.hero.cv | relative_url }}">CV ↓</a>
      </div>
    </nav>
  </header>

  <main id="main" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <p class="footer-name">{{ site.title }}</p>
        <p class="footer-sub">Aerospace × AI · Barcelona, Spain</p>
      </div>
      <div class="footer-links">
        <a href="{{ site.data.site.socials.linkedin }}">LinkedIn</a>
        <a href="{{ site.data.site.socials.github }}">GitHub</a>
        <a href="{{ site.data.site.socials.medium }}">Medium</a>
        <a href="{{ 'mailto:' | append: site.data.site.socials.email }}">Email</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </div>
      <p class="footer-copy">© {{ site.time | date: '%Y' }} {{ site.title }}</p>
    </div>
  </footer>
</body>
</html>
