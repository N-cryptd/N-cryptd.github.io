---
layout: default
---
<article class="post wrap">
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/blog/' | relative_url }}">Blog</a>
    <span aria-current="page">{{ page.title }}</span>
  </nav>
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
      {% if page.tags %} · {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}{% endif %}
    </p>
  </header>
  {% if page.description %}<p class="post-excerpt">{{ page.description }}</p>{% endif %}
  <div class="post-content">
    {{ content }}
  </div>
  <nav class="post-nav" aria-label="Blog">
    <a href="{{ '/blog/' | relative_url }}">← All posts</a>
  </nav>
</article>
